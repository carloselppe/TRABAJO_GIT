<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cómic Saludo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            text-align: center;
        }
        .comic {
            width: 300px;
            margin: 20px auto;
            border: 2px solid black;
            padding: 10px;
            background: white;
        }
        .panel {
            border: 1px solid black;
            padding: 10px;
            margin: 10px 0;
        }
        .dialogo {
            font-style: italic;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="comic">
        <div class="panel">
            <img src="imagen1.png" alt="Personaje 1">
            <p class="dialogo">¡Hola! ¿Cómo estás?</p>
        </div>
        <div class="panel">
            <img src="imagen2.png" alt="Personaje 2">
            <p class="dialogo">¡Bien! ¿Y tú?</p>
        </div>
        <div class="panel">
            <img src="imagen3.png" alt="Personaje 1">
            <p class="dialogo">¡Listo para la aventura!</p>
        </div>
    </div>

</body>
</html>
